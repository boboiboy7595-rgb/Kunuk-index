name: Update Index Automatically

on:
  schedule:
    # Runs every 6 hours (at minute 0)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub UI anytime

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and Update Upstream Versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-index.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update index.json to latest upstream versions" && git push)
