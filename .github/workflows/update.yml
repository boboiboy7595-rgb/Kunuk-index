name: Update Index Automatically

on:
  push:
    paths:
      - 'index.json'
      - 'schema.proto'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub Repo URL or owner/repo (e.g. https://github.com/InvalidDavid/UMA)'
        required: false
        type: string
      repo_type:
        description: 'Repository Type'
        required: true
        type: choice
        options:
          - usagi
          - mihon
        default: usagi

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install protobufjs

      - name: Check and Update Upstream Versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADD_REPO_URL: ${{ inputs.repo_url }}
          ADD_REPO_TYPE: ${{ inputs.repo_type }}
        run: node scripts/update-index.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.pb
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update index.json and index.pb" && git push)
